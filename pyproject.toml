[project]
name = "sorterlab"
version = "1.0.0"
description = "Parametric throughput model for an automated sorting center"
readme = "sorterlab/README.md"
requires-python = ">=3.9"
authors = [{ name = "Evgeniy Andreev" }]

[project.scripts]
sorterlab = "sorterlab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sorterlab*"]
