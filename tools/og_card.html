<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; background:#0a0a0b; }
  body {
    font-family:"Golos Text", system-ui, -apple-system, sans-serif;
    color:#f2f0ec; padding:72px 80px; position:relative;
    background:
      radial-gradient(1100px 520px at 88% -12%, rgba(201,169,106,.16), transparent 62%),
      radial-gradient(760px 420px at 6% 108%, rgba(201,169,106,.09), transparent 60%),
      #0a0a0b;
  }
  .rule { position:absolute; left:0; top:0; height:6px; width:100%;
          background:linear-gradient(90deg,#c9a96a 0 38%, rgba(201,169,106,.22) 38% 100%); }
  .kicker { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:19px;
            letter-spacing:.22em; text-transform:uppercase; color:#c9a96a; margin-bottom:26px; }
  h1 { font-family:"Oswald","Golos Text",system-ui,sans-serif; font-weight:500;
       font-size:104px; line-height:.98; letter-spacing:-.02em; margin-bottom:22px; }
  .role { font-size:37px; color:#c9a96a; font-weight:500; letter-spacing:-.01em; margin-bottom:34px; }
  .stem { font-size:31px; color:#a5a19a; line-height:1.45; max-width:820px; }
  .stem b { color:#f2f0ec; font-weight:600; }
  .foot { position:absolute; left:80px; bottom:64px; right:80px;
          display:flex; align-items:center; gap:20px;
          font-family:ui-monospace, monospace; font-size:20px; color:#8d887f; }
  .dot { width:9px; height:9px; border:1px solid #c9a96a; transform:rotate(45deg); flex:none; }
</style></head>
<body>
  <div class="rule"></div>
  <div class="kicker">Портфолио · 2026</div>
  <h1>Евгений Андреев</h1>
  <div class="role">Исследователь опыта в сложных системах</div>
  <div class="stem"><b>Вижу, где система течёт</b> — и перевожу это на язык, которым платят:
    промышленная автоматизация, премиальный сервис, образовательные продукты, интерфейсы к языковым моделям.</div>
  <div class="foot"><span class="dot"></span><span>andreevgeny.github.io/portfolio</span></div>
</body></html>
